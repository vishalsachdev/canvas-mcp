name: Deploy to Azure — production

# Deliberate deploys only. A release tag (v*) builds the container image,
# pushes it to ACR, and deploys it to the production slot of gies-canvas-mcp.
# To ship an unreleased main, run this workflow by hand from main. A merged PR
# (including an automated dependency bump) does not reach production until one
# of those two things happens.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: giescanvasmcpacr.azurecr.io
  IMAGE: canvas-mcp
  APP_NAME: canvas-mcp

jobs:
  build-and-deploy:
    # A manual run started from any other branch must not reach production.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tag
        id: tag
        run: echo "tag=azure-gies-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Deploy to production slot
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
