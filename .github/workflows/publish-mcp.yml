name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g., v1.0.8). Must already exist.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolve version
        id: version
        run: |
          REF_NAME="${{ inputs.tag_name || github.ref_name }}"
          # Strip leading 'v' to match PyPI package version (e.g. v1.3.0 -> 1.3.0)
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e .

      - name: Run tests
        # No `|| echo ... skipping`: that swallowed real failures, so a broken
        # suite could not stop a release. pytest exit code 5 is the genuine
        # "no tests collected" case and is the only one tolerated here.
        run: |
          uv pip install --system pytest pytest-asyncio
          pytest tests/ -q || { code=$?; [ "$code" -eq 5 ] && echo "No tests collected" || exit "$code"; }

      - name: Build package
        run: |
          uv pip install --system build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  publish-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Wait for PyPI propagation
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          # MCP Registry's PyPI lookup can 404 before CDN propagates after upload.
          # Poll the JSON metadata endpoint up to 12 times (6 min ceiling) until
          # the just-published version is visible. See pyproject.toml for project name.
          echo "Polling PyPI for canvas-mcp==$VERSION"
          for i in $(seq 1 12); do
            if curl -fsSL "https://pypi.org/pypi/canvas-mcp/$VERSION/json" >/dev/null 2>&1; then
              echo "Attempt $i: version $VERSION visible on PyPI"
              exit 0
            fi
            echo "Attempt $i: not yet visible, waiting 30s..."
            sleep 30
          done
          echo "ERROR: PyPI did not surface version $VERSION within 6 minutes"
          exit 1

      - name: Install MCP Publisher
        env:
          # Unauthenticated api.github.com calls are rate-limited per runner IP,
          # which are shared. On v1.11.0 the limit was hit, jq returned the string
          # "null", and the download URL 404'd into `tar: not in gzip format` —
          # a confusing failure three steps away from the real cause.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Get latest mcp-publisher release version dynamically
          VERSION=$(curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: could not resolve the latest mcp-publisher release tag."
            echo "Got: '$VERSION'. Likely an api.github.com rate limit or outage."
            exit 1
          fi
          echo "Installing mcp-publisher version: $VERSION"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          # Naming format: mcp-publisher_OS_ARCH.tar.gz (no version in filename)
          # --fail so an HTML error page never reaches tar as if it were an archive.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Login to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
