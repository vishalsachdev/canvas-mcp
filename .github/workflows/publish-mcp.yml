name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g., v1.0.8). Must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolve version
        id: version
        run: |
          REF_NAME="${{ inputs.tag_name || github.ref_name }}"
          # Strip leading 'v' to match PyPI package version (e.g. v1.3.0 -> 1.3.0)
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e .

      - name: Run tests
        # No `|| echo ... skipping`: that swallowed real failures, so a broken
        # suite could not stop a release. pytest exit code 5 is the genuine
        # "no tests collected" case and is the only one tolerated here.
        run: |
          uv pip install --system pytest pytest-asyncio pyyaml
          pytest tests/ -q || { code=$?; [ "$code" -eq 5 ] && echo "No tests collected" || exit "$code"; }

      - name: Build package
        run: |
          uv pip install --system build
          python -m build

      - name: Check packages for local-only files
        run: python scripts/check_package_contents.py dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  publish-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry's github-oidc login.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Wait for PyPI propagation
        env:
          VERSION: ${{ needs.publish-pypi.outputs.version }}
        run: |
          # MCP Registry's PyPI lookup can 404 before CDN propagates after upload.
          # Poll the JSON metadata endpoint up to 12 times (6 min ceiling) until
          # the just-published version is visible. See pyproject.toml for project name.
          echo "Polling PyPI for canvas-mcp==$VERSION"
          for i in $(seq 1 12); do
            if curl -fsSL "https://pypi.org/pypi/canvas-mcp/$VERSION/json" >/dev/null 2>&1; then
              echo "Attempt $i: version $VERSION visible on PyPI"
              exit 0
            fi
            echo "Attempt $i: not yet visible, waiting 30s..."
            sleep 30
          done
          echo "ERROR: PyPI did not surface version $VERSION within 6 minutes"
          exit 1

      - name: Install MCP Publisher
        env:
          # Official v1.8.1 Linux amd64 asset, independently downloaded and
          # checked against the GitHub release's published digest, 2026-10-20.
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          python3 scripts/install_mcp_publisher.py \
            --version "$MCP_PUBLISHER_VERSION" --sha256 "$MCP_PUBLISHER_SHA256" \
            --destination "$RUNNER_TEMP/mcp-publisher"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Login to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish
